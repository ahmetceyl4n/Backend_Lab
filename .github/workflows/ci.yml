name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DotnetBackendLab.sln

      - name: Build
        run: dotnet build DotnetBackendLab.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DotnetBackendLab.sln --configuration Release --no-build --verbosity normal
